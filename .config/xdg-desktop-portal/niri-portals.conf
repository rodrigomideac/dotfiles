[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
# Serve appearance (dark/light mode, accent, fonts, cursor) from the KDE
# portal so Chrome and other portal-aware apps match the Breeze/Plasma theme
# instead of falling back to GNOME's prefer-light default. Falls back to
# gnome;gtk if the KDE backend can't answer.
org.freedesktop.impl.portal.Settings=kde;gnome;gtk;
