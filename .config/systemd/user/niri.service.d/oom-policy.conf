# Don't tear down the whole graphical session when the kernel OOM-kills one app.
#
# Every app launched from niri lives in niri.service's cgroup. systemd's default
# OOMPolicy=stop means an OOM kill anywhere in that cgroup stops the unit, i.e.
# niri gets SIGTERM and the desktop dies with the app. Seen 2026-08-20: the
# kernel killed an 11.7G IntelliJ process and took the entire session with it.
#
# OOMPolicy=continue leaves niri running; the OOM-killed app is just a dead app.
[Service]
OOMPolicy=continue
