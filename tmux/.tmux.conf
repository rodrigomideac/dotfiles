# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Essentials
set -g mouse on
set -g history-limit 10000
set -g renumber-windows off
set -g base-index 0
setw -g pane-base-index 0

# No ESC delay (critical for vim)
set -s escape-time 0

# Focus events (essential for neovim autocommands like FocusGained/FocusLost)
set -g focus-events on

# Allow OSC 52 clipboard passthrough (for neovim copy over SSH)
set -g set-clipboard on
set -g allow-passthrough on

# True color (RGB is the modern flag; Tc is legacy)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Undercurl support (for LSP diagnostics in neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Intuitive splits (in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar
set -g status-position bottom
set -g status-style 'bg=colour234 fg=colour137'
set -g status-left '#[fg=colour233,bg=colour245,bold] #S '
set -g status-left-length 20
set -g status-right '#[fg=colour233,bg=colour245] %H:%M '
setw -g window-status-current-style 'fg=colour1 bg=colour238 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Launcher bindings (super+d style)
# Option 1 (g): built-in command-prompt at status bar bottom
bind-key g command-prompt -p "> " "new-window -c '#{pane_current_path}' -n '%1'; send-keys '%1' Enter"

# Option 2 (G): floating popup with a simple read prompt
bind-key G display-popup -E -w 50% -h 10% \
  "$HOME/.dotfiles/tmux/launcher.sh '#{pane_current_path}' prompt"

# Option 3 (F): floating popup with fzf over all commands in PATH
bind-key F display-popup -E -w 50% -h 40% \
  "$HOME/.dotfiles/tmux/launcher.sh '#{pane_current_path}' fzf"
